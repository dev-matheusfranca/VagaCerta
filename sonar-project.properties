sonar.organization=dev-matheusfranca
sonar.projectKey=dev-matheusfranca_VagaCerta
sonar.projectName=VagaCerta

sonar.sources=services,libs,web/src
sonar.tests=services
sonar.test.inclusions=services/*/tests/**
sonar.exclusions=services/*/tests/**,services/*/migrations/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
# A cobertura vem do pytest; o front-end é checado pelos tipos (vue-tsc) e pelos jobs de ponta a ponta.
sonar.coverage.exclusions=web/**

# A semente de demonstração usa Random(42) de propósito: os mesmos dados a cada subida, sem fim criptográfico.
sonar.issue.ignore.multicriteria=seed
sonar.issue.ignore.multicriteria.seed.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.seed.resourceKey=services/*/src/*/seed.py
