[project]
name = "notification"
version = "0.1.0"
description = "Booking e-mails: confirmations, cancellations and reminders."
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.1.1",
    "aiokafka>=0.14.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "opentelemetry-distro>=0.66b1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-aio-pika>=0.66b1",
    "opentelemetry-instrumentation-aiokafka>=0.66b1",
    "opentelemetry-instrumentation-asyncpg>=0.66b1",
    "opentelemetry-instrumentation-logging>=0.66b1",
    "pydantic>=2.14.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
