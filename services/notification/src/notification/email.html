<!doctype html>
<html lang="pt-BR">
<body style="margin:0;background:#f5f8f7;font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif;color:#10272a">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
  style="max-width:520px;background:#ffffff;border-radius:20px;overflow:hidden">
<tr><td style="background:#0f3f3a;padding:22px 32px;font-size:20px;font-weight:800;color:#ffffff">
  Vaga<span style="color:#78d8c4">Certa</span>
</td></tr>
<tr><td style="padding:32px 32px 8px">
  <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:$accent">$label</p>
  <h1 style="margin:0;font-size:24px;line-height:1.25">$title</h1>
  <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#4b5f62">$intro</p>
</td></tr>
<tr><td style="padding:16px 32px 8px">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-top:2px dashed #e3ebe9">$rows</table>
</td></tr>
<tr><td style="padding:24px 32px">
  <a href="$link" style="display:inline-block;background:#15695e;color:#ffffff;text-decoration:none;font-weight:700;padding:12px 24px;border-radius:999px">$cta</a>
</td></tr>
<tr><td style="padding:0 32px 32px;font-size:12px;color:#8a9a9c">
  Você recebeu este e-mail porque fez um agendamento pelo VagaCerta.
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
