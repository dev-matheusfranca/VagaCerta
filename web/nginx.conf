server {
    listen 8080;
    root /usr/share/nginx/html;

    # Arquivos do build têm hash no nome: podem ficar em cache para sempre, e um que não existe é 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html aponta para os assets da versão atual, então nunca vem do cache.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
