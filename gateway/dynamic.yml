http:
  routers:
    catalog:
      rule: PathPrefix(`/api/catalog`)
      service: catalog
      middlewares: [strip-api, security-headers]
    booking:
      rule: PathPrefix(`/api/booking`)
      service: booking
      middlewares: [strip-api, security-headers]
    booking-writes:
      rule: PathPrefix(`/api/booking/bookings`) && Method(`POST`)
      service: booking
      middlewares: [write-rate-limit, strip-api, security-headers]
    waitlist:
      rule: PathPrefix(`/api/waitlist`)
      service: waitlist
      middlewares: [strip-api, security-headers]
    waitlist-writes:
      rule: PathPrefix(`/api/waitlist`) && Method(`POST`)
      service: waitlist
      middlewares: [write-rate-limit, strip-api, security-headers]
    analytics:
      rule: PathPrefix(`/api/analytics`)
      service: analytics
      middlewares: [strip-api, security-headers]
    webhooks:
      rule: PathPrefix(`/api/webhooks`)
      service: webhooks
      middlewares: [strip-api, security-headers]
    audit:
      rule: PathPrefix(`/api/audit`)
      service: audit
      middlewares: [strip-api, security-headers]
    assistant:
      rule: PathPrefix(`/api/assistant`)
      service: assistant
      middlewares: [write-rate-limit, strip-api, security-headers]
    mcp:
      rule: PathPrefix(`/mcp`)
      service: mcp-server
      middlewares: [write-rate-limit, security-headers]
    keycloak:
      rule: PathPrefix(`/auth`)
      service: keycloak
    web:
      rule: PathPrefix(`/`)
      priority: 1
      service: web
      middlewares: [security-headers]

  middlewares:
    strip-api:
      stripPrefixRegex:
        regex: ["^/api/[a-z]+"]
    # Limita gravações por IP: protege contra abuso sem afetar a navegação, que é só leitura.
    write-rate-limit:
      rateLimit:
        average: 20
        burst: 40
        period: 1s
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

  services:
    catalog:
      loadBalancer:
        servers: [{ url: http://catalog:8000 }]
    booking:
      loadBalancer:
        servers: [{ url: http://booking:8000 }]
    waitlist:
      loadBalancer:
        servers: [{ url: http://waitlist:8000 }]
    analytics:
      loadBalancer:
        servers: [{ url: http://analytics:8000 }]
    webhooks:
      loadBalancer:
        servers: [{ url: http://webhooks:8000 }]
    audit:
      loadBalancer:
        servers: [{ url: http://audit:8000 }]
    assistant:
      loadBalancer:
        servers: [{ url: http://assistant:8000 }]
    mcp-server:
      loadBalancer:
        servers: [{ url: http://mcp-server:8000 }]
    keycloak:
      loadBalancer:
        servers: [{ url: http://keycloak:8080 }]
    web:
      loadBalancer:
        servers: [{ url: http://web:8080 }]
