# Cluster de um nó; as NodePorts do chart ficam nas mesmas portas do Docker Compose.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vagacerta
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8080 }
      - { containerPort: 30300, hostPort: 3000 }
      - { containerPort: 30825, hostPort: 8025 }
