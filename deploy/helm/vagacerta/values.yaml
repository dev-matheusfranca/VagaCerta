# Credenciais de demonstração, as mesmas do Docker Compose. Num ambiente real viriam de Secrets
# gerenciados por um cofre (Vault, External Secrets).

otel:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_SEMCONV_STABILITY_OPT_IN: http

# No cluster é um PostgreSQL só, mas cada serviço continua com o próprio banco.
postgres:
  image: postgres:17-alpine
  user: vagacerta
  password: vagacerta
  databases: [catalog, booking, waitlist, notification, analytics, audit, webhooks]
  storage: 1Gi

restricted: &restricted
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities: { drop: [ALL] }
  seccompProfile: { type: RuntimeDefault }

# Os serviços Python não escrevem em disco.
python-restricted: &python-restricted
  <<: *restricted
  readOnlyRootFilesystem: true

workloads:
  catalog:
    image: vagacerta-catalog:latest
    securityContext: *python-restricted
    otel: true
    command: [sh, -c, "alembic upgrade head && python -m catalog.seed && exec opentelemetry-instrument uvicorn catalog.main:app --host 0.0.0.0 --port 8000"]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/catalog
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/certs
    ports: { http: 8000 }
    readiness: &api-readiness
      httpGet: { path: /openapi.json, port: 8000 }
      periodSeconds: 3
      failureThreshold: 40
    waitFor: [postgres:5432]

  booking:
    image: vagacerta-booking:latest
    securityContext: *python-restricted
    otel: true
    command: [sh, -c, "alembic upgrade head && python -m booking.seed && exec opentelemetry-instrument uvicorn booking.main:app --host 0.0.0.0 --port 8000"]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/booking
      CATALOG_URL: http://catalog:8000
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/certs
    ports: { http: 8000 }
    readiness: *api-readiness
    waitFor: [postgres:5432, catalog:8000]

  booking-relay:
    image: vagacerta-booking:latest
    securityContext: *python-restricted
    otel: true
    command: [opentelemetry-instrument, python, -m, booking.outbox_relay]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    waitFor: [booking:8000, kafka:9092]

  waitlist:
    image: vagacerta-waitlist:latest
    securityContext: *python-restricted
    otel: true
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/waitlist
      CATALOG_URL: http://catalog:8000
      BOOKING_URL: http://booking:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/token
      CLIENT_SECRET: waitlist-dev-secret
      OFFER_MINUTES: "15"
    ports: { http: 8000 }
    readiness: *api-readiness
    waitFor: [postgres:5432, keycloak:8080]

  waitlist-worker:
    image: vagacerta-waitlist:latest
    securityContext: *python-restricted
    otel: true
    command: [opentelemetry-instrument, python, -m, waitlist.worker]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/waitlist
      CATALOG_URL: http://catalog:8000
      BOOKING_URL: http://booking:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/token
      CLIENT_SECRET: waitlist-dev-secret
      OFFER_MINUTES: "15"
    waitFor: [waitlist:8000, booking:8000, kafka:9092]

  notification:
    image: vagacerta-notification:latest
    securityContext: *python-restricted
    otel: true
    command: [sh, -c, "alembic upgrade head && exec opentelemetry-instrument python -m notification"]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      WEB_URL: http://localhost:8080
    waitFor: [postgres:5432, kafka:9092, rabbitmq:5672]

  analytics:
    image: vagacerta-analytics:latest
    securityContext: *python-restricted
    otel: true
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CATALOG_URL: http://catalog:8000
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/certs
    ports: { http: 8000 }
    readiness: *api-readiness
    waitFor: [postgres:5432]

  analytics-worker:
    image: vagacerta-analytics:latest
    securityContext: *python-restricted
    otel: true
    command: [opentelemetry-instrument, python, -m, analytics.worker]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/analytics
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    waitFor: [analytics:8000, kafka:9092]

  audit:
    image: vagacerta-audit:latest
    securityContext: *python-restricted
    otel: true
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/certs
    ports: { http: 8000 }
    readiness: *api-readiness
    waitFor: [postgres:5432]

  audit-worker:
    image: vagacerta-audit:latest
    securityContext: *python-restricted
    otel: true
    command: [opentelemetry-instrument, python, -m, audit.worker]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/audit
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    waitFor: [audit:8000, kafka:9092]

  webhooks:
    image: vagacerta-webhooks:latest
    securityContext: *python-restricted
    otel: true
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/webhooks
      KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/certs
    ports: { http: 8000 }
    readiness: *api-readiness
    waitFor: [postgres:5432]

  webhooks-worker:
    image: vagacerta-webhooks:latest
    securityContext: *python-restricted
    otel: true
    command: [opentelemetry-instrument, python, -m, webhooks.worker]
    env:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@postgres:5432/webhooks
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    waitFor: [webhooks:8000, kafka:9092, rabbitmq:5672]

  mcp-server:
    image: vagacerta-mcp-server:latest
    securityContext: *python-restricted
    otel: true
    command: [opentelemetry-instrument, uvicorn, mcp_server.main:app, --host, 0.0.0.0, --port, "8000"]
    env:
      CATALOG_URL: http://catalog:8000
      BOOKING_URL: http://booking:8000
      WAITLIST_URL: http://waitlist:8000
    ports: { http: 8000 }
    readiness:
      httpGet: { path: /health, port: 8000 }
      periodSeconds: 3

  # O assistente precisa de um Ollama alcançável: ligue com --set workloads.assistant.enabled=true.
  assistant:
    enabled: false
    image: vagacerta-assistant:latest
    securityContext: *python-restricted
    otel: true
    command: [opentelemetry-instrument, uvicorn, assistant.main:app, --host, 0.0.0.0, --port, "8000"]
    env:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b-instruct
      MCP_URL: http://mcp-server:8000/mcp
    ports: { http: 8000 }
    readiness: *api-readiness

  web:
    image: vagacerta-web:latest
    securityContext: *restricted
    ports: { http: 8080 }
    readiness:
      httpGet: { path: /, port: 8080 }
      periodSeconds: 3

  gateway:
    image: vagacerta-gateway:latest
    securityContext: *restricted
    args: [--entrypoints.web.address=:8000, --providers.file.filename=/etc/traefik/dynamic.yml, --ping=true, --accesslog=true]
    ports: { http: 8000 }
    nodePorts: { http: 30080 }
    readiness:
      # O ping fica no entrypoint interno do Traefik, na 8080.
      httpGet: { path: /ping, port: 8080 }
      periodSeconds: 3

  keycloak:
    image: vagacerta-keycloak:latest
    args: [start-dev, --import-realm]
    env:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    ports: { http: 8080 }
    readiness:
      httpGet: { path: /auth/health/ready, port: 9000 }
      periodSeconds: 5
      failureThreshold: 60

  kafka:
    image: apache/kafka:4.2.0
    env:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # O controller é o próprio pod: localhost evita depender do Service antes de o pod ficar pronto.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: { kafka: 9092 }
    readiness:
      tcpSocket: { port: 9092 }
      periodSeconds: 5

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    ports: { amqp: 5672 }
    readiness:
      tcpSocket: { port: 5672 }
      periodSeconds: 5

  mailpit:
    image: axllent/mailpit:v1.28
    ports: { smtp: 1025, http: 8025 }
    nodePorts: { http: 30825 }

  lgtm:
    image: vagacerta-lgtm:latest
    ports: { grafana: 3000, otlp-http: 4318 }
    nodePorts: { grafana: 30300 }
