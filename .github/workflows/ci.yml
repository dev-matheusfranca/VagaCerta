name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  services:
    runs-on: ubuntu-latest
    env:
      PACT_DO_NOT_TRACK: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy libs/auth/src services/catalog/src services/booking/src services/notification/src services/waitlist/src services/analytics/src services/mcp-server/src services/assistant/src
      - run: uv run lint-imports
      - run: uv run pytest -v
      # Os testes dos consumidores regeram os contratos: os versionados precisam estar em dia.
      - run: git diff --exit-code pacts/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait
      - run: docker compose --profile load run --rm k6
      - if: failure()
        run: docker compose logs --tail 80
