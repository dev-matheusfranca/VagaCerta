name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  services:
    runs-on: ubuntu-latest
    env:
      PACT_DO_NOT_TRACK: "true"
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run mypy libs/*/src services/*/src
      - run: uv run lint-imports
      - run: uv run pytest -v --cov --cov-report=xml
      # Os testes dos consumidores regeram os contratos: os versionados precisam estar em dia.
      - run: git diff --exit-code pacts/
      # A análise do SonarCloud roda quando o token estiver cadastrado nos secrets do repositório.
      - if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      # Dependências (uv.lock, package-lock.json) e configuração (Dockerfiles, Compose, Helm) vão
      # para a aba Security do GitHub.
      - run: trivy fs --scanners vuln,misconfig --ignorefile .trivyignore.yaml --format sarif --output trivy.sarif .
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
      - run: docker compose --profile ai build catalog booking waitlist notification analytics audit webhooks mcp-server assistant web
      # Nas imagens que construímos, vulnerabilidade alta ou crítica com correção disponível quebra o build.
      - run: |
          for service in catalog booking waitlist notification analytics audit webhooks mcp-server assistant web; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 vagacerta-$service:latest
          done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build --detach --wait
      - run: docker compose --profile load run --rm k6
      - if: failure()
        run: docker compose logs --tail 80

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true
      - run: helm lint deploy/helm/vagacerta
      - run: deploy/kind/up.sh
      - run: docker run --rm --network host -v "$PWD/load:/scripts:ro" grafana/k6:1.3.0 run /scripts/booking.js
      - if: failure()
        run: |
          kubectl get pods
          kubectl get events --sort-by=.lastTimestamp | tail -40
          kubectl logs deployment/booking --tail 80
          kubectl logs deployment/gateway --tail 80
