[tool.uv.workspace]
members = ["services/*", "libs/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"services/*/tests/*" = ["ASYNC110"]

[tool.ruff.lint.isort]
known-first-party = ["catalog", "booking", "notification", "waitlist", "analytics", "vagacerta_auth"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.importlinter]
root_packages = ["booking", "notification"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain modules do not depend on frameworks"
type = "forbidden"
source_modules = ["booking.domain", "notification.domain"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "pydantic", "aiokafka", "aio_pika"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pact-python>=4.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "testcontainers[kafka,postgres,rabbitmq]>=4.15.0",
]
