x-postgres: &postgres
  image: postgres:17-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U vagacerta"]
    interval: 2s
    retries: 15

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
  interval: 3s
  retries: 20

services:
  catalog-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: catalog
    ports: ["5433:5432"]

  booking-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: booking
    ports: ["5434:5432"]

  catalog:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: catalog }
    command: sh -c "alembic upgrade head && python -m catalog.seed && uvicorn catalog.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@catalog-db:5432/catalog
      KEYCLOAK_JWKS_URL: &jwks http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/certs
    ports: ["8001:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      catalog-db: { condition: service_healthy }

  booking:
    build: &booking-build
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: booking }
    command: sh -c "alembic upgrade head && python -m booking.seed && uvicorn booking.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@booking-db:5432/booking
      CATALOG_URL: http://catalog:8000
      KEYCLOAK_JWKS_URL: *jwks
    ports: ["8002:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      booking-db: { condition: service_healthy }
      catalog: { condition: service_healthy }

  booking-relay:
    build: *booking-build
    command: python -m booking.outbox_relay
    environment:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@booking-db:5432/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      booking: { condition: service_healthy }
      kafka: { condition: service_healthy }

  waitlist-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: waitlist
    ports: ["5436:5432"]

  waitlist:
    build: &waitlist-build
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: waitlist }
    environment: &waitlist-env
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@waitlist-db:5432/waitlist
      CATALOG_URL: http://catalog:8000
      BOOKING_URL: http://booking:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/token
      CLIENT_SECRET: waitlist-dev-secret
      OFFER_MINUTES: 15
    ports: ["8003:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      waitlist-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  waitlist-worker:
    build: *waitlist-build
    command: python -m waitlist.worker
    environment: *waitlist-env
    depends_on:
      waitlist: { condition: service_healthy }
      booking: { condition: service_healthy }
      kafka: { condition: service_healthy }

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      # O emissor dos tokens é sempre a URL pública, mesmo quando os serviços chamam pela rede interna.
      KC_HOSTNAME: http://localhost:8080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/vagacerta-realm.json:/opt/keycloak/data/import/vagacerta-realm.json:ro
      - ./keycloak/themes/vagacerta:/opt/keycloak/themes/vagacerta:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  notification-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: notification
    ports: ["5435:5432"]

  notification:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: notification }
    command: sh -c "alembic upgrade head && python -m notification"
    environment:
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@notification-db:5432/notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_URL: http://localhost:8080
    depends_on:
      notification-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.28
    ports: ["8025:8025", "1025:1025"]

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: vagacerta
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8090:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  web:
    build: web

  gateway:
    image: traefik:v3.6
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.insecure=true
      - --ping=true
      - --accesslog=true
    volumes: ["./gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro"]
    ports: ["8080:80", "8081:8080"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 3s
      retries: 20
    depends_on: [web, catalog, booking, waitlist, keycloak]
