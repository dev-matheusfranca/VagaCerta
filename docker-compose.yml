name: vagacerta

x-postgres: &postgres
  image: postgres:17-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U vagacerta"]
    interval: 2s
    retries: 15

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
  interval: 3s
  retries: 20

# Traces, métricas e logs de todos os serviços Python vão para o Grafana LGTM via OTLP.
x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: "true"
  OTEL_SEMCONV_STABILITY_OPT_IN: http

services:
  catalog-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: catalog
    ports: ["5433:5432"]

  booking-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: booking
    ports: ["5434:5432"]

  catalog:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: catalog }
    command: sh -c "alembic upgrade head && python -m catalog.seed && opentelemetry-instrument uvicorn catalog.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: catalog
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@catalog-db:5432/catalog
      KEYCLOAK_JWKS_URL: &jwks http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/certs
    ports: ["8001:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      catalog-db: { condition: service_healthy }

  booking:
    build: &booking-build
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: booking }
    command: sh -c "alembic upgrade head && python -m booking.seed && opentelemetry-instrument uvicorn booking.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: booking
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@booking-db:5432/booking
      CATALOG_URL: http://catalog:8000
      KEYCLOAK_JWKS_URL: *jwks
    ports: ["8002:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      booking-db: { condition: service_healthy }
      catalog: { condition: service_healthy }

  booking-relay:
    build: *booking-build
    command: opentelemetry-instrument python -m booking.outbox_relay
    restart: on-failure
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: booking-relay
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@booking-db:5432/booking
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      booking: { condition: service_healthy }
      kafka: { condition: service_healthy }

  waitlist-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: waitlist
    ports: ["5436:5432"]

  waitlist:
    build: &waitlist-build
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: waitlist }
    environment: &waitlist-env
      <<: *otel
      OTEL_SERVICE_NAME: waitlist
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@waitlist-db:5432/waitlist
      CATALOG_URL: http://catalog:8000
      BOOKING_URL: http://booking:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/vagacerta/protocol/openid-connect/token
      CLIENT_SECRET: waitlist-dev-secret
      OFFER_MINUTES: 15
    ports: ["8003:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      waitlist-db: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  waitlist-worker:
    build: *waitlist-build
    command: opentelemetry-instrument python -m waitlist.worker
    restart: on-failure
    environment:
      <<: *waitlist-env
      OTEL_SERVICE_NAME: waitlist-worker
    depends_on:
      waitlist: { condition: service_healthy }
      booking: { condition: service_healthy }
      kafka: { condition: service_healthy }

  analytics-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: analytics
    ports: ["5437:5432"]

  analytics:
    build: &analytics-build
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: analytics }
    environment: &analytics-env
      <<: *otel
      OTEL_SERVICE_NAME: analytics
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@analytics-db:5432/analytics
      CATALOG_URL: http://catalog:8000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_JWKS_URL: *jwks
    ports: ["8004:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      analytics-db: { condition: service_healthy }

  analytics-worker:
    build: *analytics-build
    command: opentelemetry-instrument python -m analytics.worker
    restart: on-failure
    environment:
      <<: *analytics-env
      OTEL_SERVICE_NAME: analytics-worker
    depends_on:
      analytics: { condition: service_healthy }
      kafka: { condition: service_healthy }

  keycloak:
    build: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      # O emissor dos tokens é sempre a URL pública, mesmo quando os serviços chamam pela rede interna.
      KC_HOSTNAME: http://localhost:8080/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  notification-db:
    <<: *postgres
    environment:
      POSTGRES_USER: vagacerta
      POSTGRES_PASSWORD: vagacerta
      POSTGRES_DB: notification
    ports: ["5435:5432"]

  notification:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: notification }
    command: sh -c "alembic upgrade head && opentelemetry-instrument python -m notification"
    restart: on-failure
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: notification
      DATABASE_URL: postgresql+asyncpg://vagacerta:vagacerta@notification-db:5432/notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_URL: http://localhost:8080
    depends_on:
      notification-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    # Com o healthcheck rodando como root, ele podia criar o .erlang.cookie antes do servidor e
    # deixá-lo ilegível para o usuário rabbitmq.
    user: rabbitmq
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.28
    ports: ["8025:8025", "1025:1025"]

  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: vagacerta
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: -Xms64m -Xmx256m
    ports: ["8090:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  lgtm:
    build: observability
    ports: ["3000:3000"]

  mcp-server:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: mcp-server }
    command: opentelemetry-instrument uvicorn mcp_server.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: mcp-server
      CATALOG_URL: http://catalog:8000
      BOOKING_URL: http://booking:8000
      WAITLIST_URL: http://waitlist:8000
    ports: ["8005:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 20
    depends_on:
      catalog: { condition: service_healthy }
      booking: { condition: service_healthy }
      waitlist: { condition: service_healthy }

  # Assistente com LLM local: sobe com `docker compose --profile ai up`.
  assistant:
    build:
      context: .
      dockerfile: services/Dockerfile
      args: { SERVICE: assistant }
    profiles: [ai]
    command: opentelemetry-instrument uvicorn assistant.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *otel
      OTEL_SERVICE_NAME: assistant
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      MCP_URL: http://mcp-server:8000/mcp
    ports: ["8006:8000"]
    healthcheck: *api-healthcheck
    depends_on:
      mcp-server: { condition: service_healthy }

  ollama:
    image: ollama/ollama:0.40.10
    profiles: [ai]
    volumes: ["ollama:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      retries: 20

  ollama-model:
    image: ollama/ollama:0.40.10
    profiles: [ai]
    command: pull ${OLLAMA_MODEL:-qwen3:4b-instruct}
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama: { condition: service_healthy }

  web:
    build: web

  gateway:
    build: gateway
    command:
      - --entrypoints.web.address=:8000
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --api.insecure=true
      - --ping=true
      - --accesslog=true
    ports: ["8080:8000", "8081:8080"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 3s
      retries: 20
    depends_on: [web, catalog, booking, waitlist, analytics, mcp-server, keycloak]

  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    command: run /scripts/booking.js
    environment:
      BASE_URL: http://gateway:8000
    volumes: ["./load:/scripts:ro"]
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  ollama:
